<html lang="fr">

</head>
<body>
    <section>
        <h1>Welcome to My Website</h1>
        <p>This is a sample website using JavaScript modules.</p>

    <section>

        <p>This section provides information about the website.</p>
    </section>
    <section>
        <h2>Contact</h2>
        <p>You can contact us at <a href="mailto:info@example.com">info@example.com</a>.</p>
    </section>
    <script type="module" src="/main.js"></script>

</html>
